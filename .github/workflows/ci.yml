name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      # The real OCR tests fail instead of being skipped when a program or language is missing.
      NODESTRO_REQUIRE_REAL_OCR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The real OCR tests run with the real programs and all six Nodestro languages (the other tests simulate them).
      - name: Install tesseract and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils \
            tesseract-ocr-deu tesseract-ocr-spa tesseract-ocr-fra tesseract-ocr-por tesseract-ocr-ita
          tesseract --version
          tesseract --list-langs
          pdftoppm -v
          pdfinfo -v
      - name: Install the package
        run: |
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  platforms:
    # INT-002: the real OCR programs on macOS (Homebrew) and Windows (UB Mannheim tesseract, poppler from
    # Chocolatey). Both passed on 2026-11-06 (PR #66), so the job is blocking.
    name: real OCR (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      NODESTRO_REQUIRE_REAL_OCR: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tesseract and poppler (Homebrew)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang poppler
      - name: Install tesseract and poppler (Chocolatey)
        if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress tesseract poppler
          echo "C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_PATH"
      # The Windows installer brings eng and osd. The other languages come from tessdata_fast at a pinned commit
      # (the same files as Ubuntu's packages), checked by SHA-256, into the installer's tessdata folder: that
      # folder also holds configs/tsv, which the TSV output needs.
      - name: Add the Nodestro languages (Windows)
        if: runner.os == 'Windows'
        run: |
          tessdata="/c/Program Files/Tesseract-OCR/tessdata"
          base=https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd
          while read -r sum lang; do
            curl -sSfL -o "$RUNNER_TEMP/$lang.traineddata" "$base/$lang.traineddata"
            echo "$sum  $RUNNER_TEMP/$lang.traineddata" | sha256sum -c -
            cp "$RUNNER_TEMP/$lang.traineddata" "$tessdata/"
          done <<'EOF'
          19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d deu
          6f2e04d02774a18f01bed44b1111f2cd7f3ba7ac9dc4373cd3f898a40ea6b464 spa
          ced037562e8c80c13122dece28dd477d399af80911a28791a66a63ac1e3445ca fra
          c4932b937207a9514b7514d518b931a99938c02a28a5a5a553f8599ed58b7deb por
          b8f89e1e785118dac4d51ae042c029a64edb5c3ee42ef73027a6d412748d8827 ita
          EOF
      - name: Show the programs
        run: |
          tesseract --version
          tesseract --list-langs
          pdftoppm -v
          pdfinfo -v
      - run: pip install -e ".[dev]"
      # macOS runs the whole suite. The simulated programs are POSIX scripts, so Windows runs the real-OCR tests.
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: pytest
      - name: Real-OCR tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -k real_ocr -v

  package:
    # The wheel installs on its own, contains what the package needs at run time and registers the entry point.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build==1.6.1
      - run: python -m build
      - name: Check the contents of the wheel and the source distribution
        run: |
          unzip -l dist/*.whl
          tar -tzf dist/*.tar.gz
          unzip -l dist/*.whl | grep -q "nodestro_integrations/py.typed"
          unzip -p dist/*.whl "*.dist-info/entry_points.txt" | grep -q "tesseract-ocr = nodestro_integrations.ocr:integration"
          if unzip -l dist/*.whl | grep -q "tests/"; then
            echo "::error::The wheel contains the tests."
            exit 1
          fi
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
      - name: The runtime discovers the installed integration
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel/bin/python" - <<'EOF'
          import nodestro_integrations
          from nodestro_integrations.ocr import ocr_available
          from nodestro_runtime.extensions import CONTRACT, Extensions, discover

          found = {item.name: item for item in discover()}
          item = found["tesseract-ocr"]
          assert item.version == nodestro_integrations.__version__ != "0.0.0", item.version
          assert item.contract == CONTRACT and item.ocr is not None
          # Installed, but OCR is offered only when the programs and a language are there.
          assert (Extensions([item]).ocr() is not None) == ocr_available()
          print(nodestro_integrations.__file__, item)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
